name: Sugerir uma melhoria
description: Proponha uma funcionalidade ou melhoria.
title: "feature: "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Necessidade ou problema
      description: Quem precisa disso e em qual situação?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solução sugerida
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Como validar
      description: Liste resultados observáveis que indicam que a melhoria funciona.
