name: CI

on:
  push:
    branches: [frontend, develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Front-end lint, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar lint
        run: npm run lint

      - name: Executar testes
        run: npm test

      - name: Gerar build de produção
        run: npm run build

  backend:
    name: Back-end lint e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: volei_user
          POSTGRES_PASSWORD: volei_pass
          POSTGRES_DB: volei_plus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U volei_user -d volei_plus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout front-end e documentação
        uses: actions/checkout@v4

      - name: Checkout da branch de back-end
        uses: actions/checkout@v4
        with:
          ref: backend
          path: backend

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Aplicar migrações
        working-directory: backend
        env:
          DATABASE_URL: postgresql://volei_user:volei_pass@localhost:5432/volei_plus_test
          SECRET_KEY: ci-only-secret-key
          APP_ENV: test
          DEBUG: "false"
        run: alembic upgrade head

      - name: Executar lint, formatação e testes
        working-directory: backend
        env:
          DATABASE_URL: postgresql://volei_user:volei_pass@localhost:5432/volei_plus_test
          SECRET_KEY: ci-only-secret-key
          APP_ENV: test
          DEBUG: "false"
        run: |
          ruff check src tests
          black --check src tests
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=70
