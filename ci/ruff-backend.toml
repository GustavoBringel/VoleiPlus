line-length = 100
target-version = "py312"

[lint]
select = [
  "E", "F", "I", "W", "UP", "B", "C4", "ANN", "T20", "PTH", "ARG", "SIM", "RET",
  "TRY", "NPY", "LOG", "TD", "FURB", "EXE", "ISC", "ICN", "PIE", "PGH", "PL", "PT",
]
ignore = ["ANN101", "ANN102", "ANN201", "ANN202", "ANN204", "ARG001", "ARG002", "TRY003", "PTH118", "PTH123"]

[lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S311"]
